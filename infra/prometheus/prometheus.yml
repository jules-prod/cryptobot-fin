global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: cryptobot
    env: prod

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: collector
    metrics_path: /metrics
    static_configs:
      - targets: ["collector:8001"]

  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8889"]

  - job_name: nginx
    static_configs:
      - targets: ["host.docker.internal:9113"]

