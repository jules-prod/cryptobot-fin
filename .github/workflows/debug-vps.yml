name: Debug VPS (data freshness)

on:
  workflow_dispatch:
  push:
    branches: [prod]
    paths:
      - ".github/workflows/debug-vps.yml"

jobs:
  diag:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          VPS_HOST=$(printf '%s' "$VPS_HOST" | tr -d '\n\r\t ')
          echo "VPS_HOST_CLEAN=$VPS_HOST" >> $GITHUB_ENV
          ssh-keyscan -T 30 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Recent API calls from frontend
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@$VPS_HOST_CLEAN 'cd ~/cryptobot && docker compose logs --tail=200 api | grep -E "GET /signals|GET /ohlcv" | tail -40'

      - name: Run fetch_signals from inside frontend container
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@$VPS_HOST_CLEAN 'cd ~/cryptobot && docker compose exec -T frontend python -c "
          import sys; sys.path.insert(0, \"/app\")
          from frontend.api_client import APIClient
          from frontend.config import frontend_settings
          print(\"api_url:\", frontend_settings.api_url)
          print(\"default_exchange:\", repr(frontend_settings.default_exchange))
          c = APIClient()
          r = c.fetch_signals(\"ADA/USDT\", \"1d\", limit=200, exchange=frontend_settings.default_exchange)
          print(\"len:\", len(r) if r else None)
          if r:
              print(\"first:\", r[0][\"timestamp\"])
              print(\"last:\", r[-1][\"timestamp\"])
              print(\"signals[-5:]:\")
              for x in r[-5:]: print(\"  \", x[\"timestamp\"], x[\"close\"])
          "'
