name: Debug VPS (data freshness)

on:
  workflow_dispatch:
  push:
    branches: [prod]
    paths:
      - ".github/workflows/debug-vps.yml"

jobs:
  diag:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          VPS_HOST=$(printf '%s' "$VPS_HOST" | tr -d '\n\r\t ')
          echo "VPS_HOST_CLEAN=$VPS_HOST" >> $GITHUB_ENV
          ssh-keyscan -T 30 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: API signals payload BTC 1h limit=200 - check date span
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@$VPS_HOST_CLEAN 'cd ~/cryptobot && docker compose exec -T api curl -s "http://localhost:8000/signals?symbol=BTC/USDT&timeframe=1h&limit=200&exchange=binance" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          print(f\"total: {len(d)}\")
          print(f\"first: {d[0][\\\"timestamp\\\"]}\")
          print(f\"last:  {d[-1][\\\"timestamp\\\"]}\")
          # Detect gaps > 1h
          from datetime import datetime
          prev = None
          gaps = 0
          for r in d:
              t = datetime.fromisoformat(r[\"timestamp\"])
              if prev:
                  delta = (t - prev).total_seconds() / 3600
                  if delta > 1.5:
                      print(f\"  GAP after {prev}: {delta:.1f}h missing\")
                      gaps += 1
              prev = t
          print(f\"total gaps > 1.5h: {gaps}\")
          "'
