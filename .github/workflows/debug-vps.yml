name: Debug VPS (data freshness)

on:
  workflow_dispatch:
  push:
    branches: [prod]
    paths:
      - ".github/workflows/debug-vps.yml"

jobs:
  diag:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          VPS_HOST=$(printf '%s' "$VPS_HOST" | tr -d '\n\r\t ')
          echo "VPS_HOST_CLEAN=$VPS_HOST" >> $GITHUB_ENV
          ssh-keyscan -T 30 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Find all crypto_data.db files everywhere
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@$VPS_HOST_CLEAN '
            echo "=== Host filesystem ==="
            sudo find / -name "crypto_data.db" 2>/dev/null
            echo
            echo "=== api container ==="
            docker exec cryptobot-api-1 find / -name "crypto_data.db" 2>/dev/null
            echo
            echo "=== collector container ==="
            docker exec cryptobot-collector-1 find / -name "crypto_data.db" 2>/dev/null
            echo
            echo "=== Sizes ==="
            ls -la ~/cryptobot/data/processed/
          '
