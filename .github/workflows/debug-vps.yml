name: Debug VPS (data freshness)

on:
  workflow_dispatch:
  push:
    branches: [prod]
    paths:
      - ".github/workflows/debug-vps.yml"

jobs:
  diag:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          VPS_HOST=$(printf '%s' "$VPS_HOST" | tr -d '\n\r\t ')
          echo "VPS_HOST_CLEAN=$VPS_HOST" >> $GITHUB_ENV
          ssh-keyscan -T 30 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Re-check DB state (BTC 1h count + first hours of May 11-12 gap)
        run: |
          cat > /tmp/check.py <<'PYEOF'
          import sqlite3
          con = sqlite3.connect("/app/data/processed/crypto_data.db")
          # check actual count and date range
          r = con.execute("SELECT COUNT(*), MIN(timestamp), MAX(timestamp) FROM ohlcv WHERE symbol='BTC/USDT' AND timeframe='1h' AND exchange='binance'").fetchone()
          print(f"BTC 1h binance count: {r[0]}, min: {r[1]}, max: {r[2]}")
          # check May 10-26 gap
          print("=== BTC 1h binance count per day May 10-26 ===")
          for d, n in con.execute("SELECT DATE(timestamp), COUNT(*) FROM ohlcv WHERE symbol='BTC/USDT' AND timeframe='1h' AND exchange='binance' AND timestamp >= '2026-05-10' AND timestamp <= '2026-05-26' GROUP BY DATE(timestamp) ORDER BY DATE(timestamp)").fetchall():
              print(f"  {d}  n={n}")
          # check distinct exchange values for ADA 1h (uppercase/lowercase variants?)
          print("=== Distinct (symbol, timeframe, exchange) for BTC 1h ===")
          for row in con.execute("SELECT DISTINCT symbol, timeframe, exchange FROM ohlcv WHERE symbol LIKE '%BTC%USDT%' AND timeframe='1h'").fetchall():
              print(f"  {row}")
          PYEOF
          scp -o StrictHostKeyChecking=no /tmp/check.py ubuntu@$VPS_HOST_CLEAN:/tmp/check.py
          ssh -o StrictHostKeyChecking=no ubuntu@$VPS_HOST_CLEAN 'docker cp /tmp/check.py cryptobot-api-1:/tmp/check.py && docker compose -f ~/cryptobot/docker-compose.yml exec -T api python3 /tmp/check.py'
