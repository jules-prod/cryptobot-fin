name: Backfill OHLCV (clean rebuild)

on:
  workflow_dispatch:
  push:
    branches: [prod]
    paths:
      - ".github/workflows/backfill-ohlcv.yml"

jobs:
  backfill:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          VPS_HOST=$(printf '%s' "$VPS_HOST" | tr -d '\n\r\t ')
          echo "VPS_HOST_CLEAN=$VPS_HOST" >> $GITHUB_ENV
          ssh-keyscan -T 30 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Wipe binance OHLCV + refetch clean (365d 1h, 730d 4h, 1825d 1d)
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@$VPS_HOST_CLEAN 'cd ~/cryptobot && docker compose exec -T api python - <<PYEOF
          import ccxt, sqlite3, time
          from datetime import datetime, timezone, timedelta

          DB = "/app/data/processed/crypto_data.db"
          SYMBOLS = ["BTC/USDT", "ETH/USDT", "SOL/USDT", "ADA/USDT", "BNB/USDT"]
          TFS = {"1h": 365, "4h": 730, "1d": 1825}

          con = sqlite3.connect(DB)
          cur = con.cursor()

          # WIPE binance rows for our 5 symbols
          for s in SYMBOLS:
              cur.execute("DELETE FROM ohlcv WHERE exchange=? AND symbol=?", ("binance", s))
          con.commit()
          print(f"Wiped binance rows. Total before refetch:")
          for s, tf, n in cur.execute("SELECT symbol, timeframe, COUNT(*) FROM ohlcv WHERE exchange=\"binance\" GROUP BY symbol, timeframe").fetchall():
              print(f"  {s:10s} {tf:3s}  n={n}")

          ex = ccxt.binance({"enableRateLimit": True})
          inserted_total = 0
          for symbol in SYMBOLS:
              for tf, days_back in TFS.items():
                  since = int((datetime.now(timezone.utc) - timedelta(days=days_back)).timestamp() * 1000)
                  fetched = 0
                  while True:
                      batch = ex.fetch_ohlcv(symbol, tf, since=since, limit=1000)
                      if not batch: break
                      # Normalized timestamp WITHOUT microseconds
                      rows = [(symbol, tf, "binance",
                               datetime.fromtimestamp(c[0]/1000, tz=timezone.utc).strftime("%Y-%m-%d %H:%M:%S"),
                               c[1], c[2], c[3], c[4], c[5]) for c in batch]
                      cur.executemany("INSERT INTO ohlcv (symbol, timeframe, exchange, timestamp, open, high, low, close, volume) VALUES (?,?,?,?,?,?,?,?,?)", rows)
                      con.commit()
                      inserted_total += len(batch)
                      since = batch[-1][0] + 1
                      fetched += len(batch)
                      if len(batch) < 1000: break
                      time.sleep(0.3)
                  print(f"{symbol:10s} {tf:3s}  fetched={fetched:6d}")
          print(f"TOTAL inserted: {inserted_total}")
          PYEOF'

      - name: Verify per-day BTC 1h coverage
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@$VPS_HOST_CLEAN 'cd ~/cryptobot && docker compose exec -T api python - <<PYEOF
          import sqlite3
          con = sqlite3.connect("/app/data/processed/crypto_data.db")
          print("=== BTC 1h binance days with count != 24 ===")
          rows = con.execute("SELECT DATE(timestamp), COUNT(*) FROM ohlcv WHERE symbol=\"BTC/USDT\" AND timeframe=\"1h\" AND exchange=\"binance\" GROUP BY DATE(timestamp) HAVING COUNT(*) != 24 ORDER BY DATE(timestamp)").fetchall()
          if not rows:
              print("  ALL DAYS HAVE EXACTLY 24 HOURS")
          else:
              for d, n in rows: print(f"  {d}  n={n}")
          print()
          print("=== Totals binance ===")
          for s, tf, n in con.execute("SELECT symbol, timeframe, COUNT(*) FROM ohlcv WHERE exchange=\"binance\" GROUP BY symbol, timeframe ORDER BY symbol, timeframe").fetchall():
              print(f"  {s:10s} {tf:3s}  n={n}")
          PYEOF'

      - name: Restart api + frontend
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@$VPS_HOST_CLEAN 'cd ~/cryptobot && docker compose restart api frontend && sleep 6'
