name: Backfill OHLCV gaps

on:
  workflow_dispatch:
  push:
    branches: [prod]
    paths:
      - ".github/workflows/backfill-ohlcv.yml"

jobs:
  backfill:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          VPS_HOST=$(printf '%s' "$VPS_HOST" | tr -d '\n\r\t ')
          echo "VPS_HOST_CLEAN=$VPS_HOST" >> $GITHUB_ENV
          ssh-keyscan -T 30 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run backfill (60 days for 1h, 90 days for 4h, all symbols)
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@$VPS_HOST_CLEAN 'cd ~/cryptobot && docker compose exec -T api python - <<PYEOF
          import ccxt, sqlite3, time
          from datetime import datetime, timezone, timedelta

          DB = "/app/data/processed/crypto_data.db"
          SYMBOLS = ["BTC/USDT", "ETH/USDT", "SOL/USDT", "ADA/USDT", "BNB/USDT"]
          TFS = {"1h": 60, "4h": 90, "1d": 365}  # tf -> days back

          ex = ccxt.binance({"enableRateLimit": True})
          con = sqlite3.connect(DB)
          cur = con.cursor()

          inserted_total = 0
          for symbol in SYMBOLS:
              for tf, days_back in TFS.items():
                  since = int((datetime.now(timezone.utc) - timedelta(days=days_back)).timestamp() * 1000)
                  all_candles = []
                  fetched = 0
                  while True:
                      batch = ex.fetch_ohlcv(symbol, tf, since=since, limit=1000)
                      if not batch:
                          break
                      all_candles.extend(batch)
                      since = batch[-1][0] + 1
                      fetched += len(batch)
                      if len(batch) < 1000:
                          break
                      time.sleep(0.3)
                  # Insert with INSERT OR IGNORE on (symbol, timeframe, timestamp, exchange)
                  rows = [(symbol, tf, "binance", datetime.fromtimestamp(c[0]/1000, tz=timezone.utc).replace(tzinfo=None).isoformat(sep=" "), c[1], c[2], c[3], c[4], c[5]) for c in all_candles]
                  cur.executemany(
                      "INSERT OR IGNORE INTO ohlcv (symbol, timeframe, exchange, timestamp, open, high, low, close, volume) VALUES (?,?,?,?,?,?,?,?,?)",
                      rows
                  )
                  inserted = cur.rowcount
                  con.commit()
                  print(f"{symbol:10s} {tf:3s}  fetched={fetched:5d}  inserted_new={inserted}")
                  inserted_total += inserted
          print(f"TOTAL inserted: {inserted_total}")
          PYEOF'

      - name: Verify freshness post-backfill
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@$VPS_HOST_CLEAN 'cd ~/cryptobot && docker compose exec -T api python - <<PYEOF
          import sqlite3
          con = sqlite3.connect("/app/data/processed/crypto_data.db")
          rows = con.execute("SELECT symbol, timeframe, COUNT(*), MIN(timestamp), MAX(timestamp) FROM ohlcv WHERE exchange=\"binance\" GROUP BY symbol, timeframe ORDER BY symbol, timeframe").fetchall()
          for s, tf, n, mn, mx in rows:
              print(f"{s:10s} {tf:3s}  n={n:6d}  min={mn}  max={mx}")
          PYEOF'
