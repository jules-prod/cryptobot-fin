name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  ci:
    name: CI Gate
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy via Ansible
    runs-on: ubuntu-latest
    needs: ci
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Ansible
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-core>=2.16,<2.18" ansible-lint
          ansible-galaxy collection install community.docker community.general ansible.posix

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          for i in 1 2 3; do
            ssh-keyscan -T 30 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null && break
            echo "ssh-keyscan retry $i"
            sleep 5
          done

      - name: Lint playbooks
        run: ansible-lint infra/ansible/playbooks/ || echo "ansible-lint warnings (non-blocking)"
        continue-on-error: true

      - name: Run deploy playbook
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          ANSIBLE_HOST_KEY_CHECKING: "False"
        working-directory: infra/ansible
        run: |
          ansible-playbook -i inventories/production.ini playbooks/deploy.yml -v

      - name: External smoke test
        run: |
          set -euo pipefail
          echo "--- Smoke test https://dtsc-cryptobot.fr/health ---"
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 https://dtsc-cryptobot.fr/health | grep -q '"status":"ok"'; then
              echo "Health OK"
              exit 0
            fi
            echo "Waiting for health... ($i/12)"
            sleep 5
          done
          echo "FAIL: /health did not return ok within 60s" >&2
          curl -v https://dtsc-cryptobot.fr/health || true
          exit 1
