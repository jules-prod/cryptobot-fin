name: Dedupe OHLCV duplicates

on:
  workflow_dispatch:
  push:
    branches: [prod]
    paths:
      - ".github/workflows/dedupe-ohlcv.yml"

jobs:
  dedupe:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          VPS_HOST=$(printf '%s' "$VPS_HOST" | tr -d '\n\r\t ')
          echo "VPS_HOST_CLEAN=$VPS_HOST" >> $GITHUB_ENV
          ssh-keyscan -T 30 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Dedupe + add UNIQUE index
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@$VPS_HOST_CLEAN 'cd ~/cryptobot && docker compose exec -T api python - <<PYEOF
          import sqlite3
          con = sqlite3.connect("/app/data/processed/crypto_data.db")
          cur = con.cursor()

          print("=== BEFORE ===")
          for s, tf, n in cur.execute("SELECT symbol, timeframe, COUNT(*) FROM ohlcv GROUP BY symbol, timeframe ORDER BY symbol, timeframe").fetchall():
              print(f"{s:10s} {tf:3s}  n={n}")

          # Keep only the row with MIN(rowid) for each (symbol, timeframe, exchange, timestamp)
          cur.execute("""
              DELETE FROM ohlcv WHERE rowid NOT IN (
                  SELECT MIN(rowid) FROM ohlcv GROUP BY symbol, timeframe, exchange, timestamp
              )
          """)
          deleted = cur.rowcount
          con.commit()
          print(f"Deleted {deleted} duplicate rows")

          # Add UNIQUE index to prevent future duplicates (idempotent)
          cur.execute("CREATE UNIQUE INDEX IF NOT EXISTS ux_ohlcv_unique ON ohlcv (symbol, timeframe, exchange, timestamp)")
          con.commit()
          print("Added UNIQUE index ux_ohlcv_unique")

          print("=== AFTER ===")
          for s, tf, n in cur.execute("SELECT symbol, timeframe, COUNT(*) FROM ohlcv GROUP BY symbol, timeframe ORDER BY symbol, timeframe").fetchall():
              print(f"{s:10s} {tf:3s}  n={n}")
          PYEOF'

      - name: Restart frontend (clear cache)
        run: |
          ssh -o StrictHostKeyChecking=no ubuntu@$VPS_HOST_CLEAN 'cd ~/cryptobot && docker compose restart frontend && sleep 4 && docker compose ps frontend'
